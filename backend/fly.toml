# fly.toml app configuration file generated for inminutes-takehome on 2026-09-12T16:30:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inminutes-takehome'
primary_region = 'sin'

[build]

[env]
  FRONTEND_URL = 'http://localhost:8080'
  PORT = '3000'
  SESSION_SWEEP_INTERVAL_MS = '60000'
  SESSION_TTL_SECONDS = '1800'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
